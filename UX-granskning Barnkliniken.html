  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:14px;color:var(--text);}\n  p.muted{color:var(--text2);}\n\n  /* ─── Sammanfattningskort ─── */\n  .summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow);margin-bottom:24px;}\n  .summary ol{counter-reset:itm;list-style:none;display:flex;flex-direction:column;gap:18px;}\n  .summary li{counter-increment:itm;position:relative;padding-left:48px;}\n  .summary li::before{content:counter(itm,decimal-leading-zero);position:absolute;left:0;top:2px;font-family:'DM Mono',monospace;font-size:12px;font-weight:500;color:var(--accent);background:var(--accent-light);padding:3px 7px;border-radius:5px;letter-spacing:.04em;}\n  .summary li strong{display:block;font-size:15px;margin-bottom:3px;color:var(--text);}\n  .summary li span{font-size:14px;color:var(--text2);line-height:1.55;}\n\n  /* ─── Princip-block ─── */\n  .principles{background:var(--accent-light);border-left:4px solid var(--accent);border-radius:6px;padding:20px 24px;margin:24px 0;}\n  .principles h4{color:var(--accent-deep);text-transform:uppercase;font-size:11px;letter-spacing:.1em;margin-bottom:10px;}\n  .principles p{font-size:14px;color:var(--accent-deep);margin:0;}\n\n  /* ─── Findings ─── */\n  .finding{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:18px;box-shadow:var(--shadow);}\n  .finding-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;}\n  .severity{flex-shrink:0;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;padding:4px 9px;border-radius:5px;letter-spacing:.04em;text-transform:uppercase;}\n  .sev-high{background:var(--red-light);color:var(--red);}\n  .sev-med{background:var(--warn-light);color:var(--warn);}\n  .sev-low{background:var(--accent-light);color:var(--accent);}\n  .finding-title{font-size:17px;font-weight:600;line-height:1.3;flex:1;}\n  .finding-body{color:var(--text2);font-size:14px;}\n  .finding-body p{color:var(--text2);}\n  .finding-body strong{color:var(--text);}\n\n  .obs-list{display:flex;flex-direction:column;gap:6px;margin:14px 0;padding-left:20px;}\n  .obs-list li{font-size:14px;color:var(--text2);}\n\n  /* ─── Before/after ─── */\n  .ba-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px;}\n  .ba-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;}\n  .ba-card.after{background:var(--surface);border-color:var(--accent);}\n  .ba-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:6px;}\n  .ba-card.after .ba-label{color:var(--accent);}\n  .ba-label::before{content:\"\";width:6px;height:6px;border-radius:50%;background:var(--text3);}\n  .ba-card.after .ba-label::before{background:var(--accent);}\n\n  /* ─── Mockup: toolbar ─── */\n  .mk-toolbar{display:flex;flex-wrap:wrap;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px;font-size:11px;}\n  .mk-toolbar .mk-btn{padding:4px 8px;background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text2);font-size:11px;white-space:nowrap;}\n  .mk-toolbar.crowded .mk-btn{font-size:10px;padding:3px 6px;}\n\n  .mk-toolbar-clean{background:var(--surface);border:1px solid var(--border);border-radius:7px;display:flex;align-items:center;padding:6px 8px;gap:6px;font-size:12px;}\n  .mk-group{display:flex;gap:4px;}\n  .mk-group .mk-btn{padding:5px 10px;background:transparent;border:none;color:var(--text);font-weight:500;font-size:12px;border-radius:5px;}\n  .mk-group .mk-btn.primary{background:var(--accent);color:#fff;}\n  .mk-group .mk-btn:hover{background:var(--bg);}\n  .mk-divider{width:1px;height:18px;background:var(--border);margin:0 4px;}\n  .mk-more{margin-left:auto;font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border);border-radius:5px;}\n\n  /* ─── Mockup: warning panel ─── */\n  .mk-warn-bad{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;background:var(--warn-light);border:1px solid var(--warn);color:var(--warn);font-size:11px;font-weight:600;border-radius:6px;}\n  .mk-warn-panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;}\n  .mk-warn-panel header{padding:10px 14px;background:var(--warn-light);border-bottom:1px solid var(--warn);display:flex;align-items:center;gap:8px;}\n  .mk-warn-panel header strong{font-size:13px;color:var(--warn);}\n  .mk-warn-panel header span{font-size:11px;color:var(--text2);margin-left:auto;}\n  .mk-warn-row{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px;font-size:12px;}\n  .mk-warn-row:last-child{border-bottom:none;}\n  .mk-warn-row .tag{font-family:'DM Mono',monospace;font-size:9px;font-weight:600;padding:2px 5px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;}\n  .mk-warn-row .desc{flex:1;color:var(--text);}\n  .mk-warn-row .desc em{color:var(--text2);font-style:normal;font-size:11px;display:block;margin-top:2px;}\n  .mk-warn-row .fix{font-size:11px;color:var(--accent);font-weight:600;flex-shrink:0;}\n\n  /* ─── Mockup: context menu ─── */\n  .mk-ctx{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px;box-shadow:var(--shadow-lg);width:230px;font-size:12px;}\n  .mk-ctx-head{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:4px 8px 6px;}\n  .mk-ctx-row{padding:5px 8px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:11px;border:1px solid var(--border);margin-bottom:3px;background:var(--surface);}\n  .mk-ctx-row .av{width:18px;height:18px;border-radius:50%;background:var(--jv1-light);color:var(--jv1);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;}\n  .mk-ctx-row .name{flex:1;font-weight:500;}\n  .mk-ctx-row .badge{font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);padding:1px 4px;background:var(--bg);border-radius:3px;}\n  .mk-ctx-row.disabled{opacity:.5;}\n  .mk-ctx-row.recommended{border-color:var(--accent);background:var(--accent-light);}\n  .mk-ctx-reason{font-size:10px;color:var(--text2);padding:2px 8px 6px;font-style:italic;}\n\n  /* ─── Mockup: cell ─── */\n  .mk-cells{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:12px;}\n  .mk-day{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:7px;}\n  .mk-day-h{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:5px;display:flex;justify-content:space-between;}\n  .mk-day-h strong{color:var(--text);}\n  .mk-slot{padding:5px 8px;background:var(--surface);border:1px solid var(--border);border-radius:5px;font-size:11px;margin-bottom:3px;display:flex;align-items:center;gap:5px;}\n  .mk-slot .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}\n  .mk-slot.empty{border-style:dashed;color:var(--text3);justify-content:center;}\n  .mk-slot.warn{border-color:var(--warn);background:var(--warn-light);color:var(--warn);}\n\n  /* ─── Sammanfattningstabell ─── */\n  .priority-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:18px;background:var(--surface);border-radius:8px;overflow:hidden;border:1px solid var(--border);}\n  .priority-table th{padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--border);text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);}\n  .priority-table td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top;}\n  .priority-table tr:last-child td{border-bottom:none;}\n  .priority-table .effort{font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);white-space:nowrap;}\n  .priority-table .impact{font-family:'DM Mono',monospace;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;letter-spacing:.03em;display:inline-block;}\n  .priority-table .impact.h{background:var(--red-light);color:var(--red);}\n  .priority-table .impact.m{background:var(--warn-light);color:var(--warn);}\n  .priority-table .impact.l{background:var(--accent-light);color:var(--accent);}\n\n  /* ─── Inline ─── */\n  .pill{display:inline-block;font-family:'DM Mono',monospace;font-size:11px;background:var(--bg);border:1px solid var(--border);color:var(--text2);padding:1px 6px;border-radius:4px;}\n  blockquote{margin:14px 0;padding:8px 16px;border-left:3px solid var(--accent);color:var(--text2);font-style:italic;font-size:14px;}\n  ul.checklist{list-style:none;display:flex;flex-direction:column;gap:8px;margin:12px 0;}\n  ul.checklist li{padding-left:24px;position:relative;font-size:14px;color:var(--text);}\n  ul.checklist li::before{content:\"✓\";position:absolute;left:0;top:0;color:var(--good);font-weight:700;}\n  ul.x-list li::before{content:\"✗\";color:var(--red);}\n  a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;}\n\n  /* ─── Footer ─── */\n  footer{margin-top:96px;padding-top:32px;border-top:1px solid var(--border);font-size:12px;color:var(--text3);display:flex;justify-content:space-between;align-items:center;}\n\n  @media (max-width:700px){\n    .page{padding:32px 20px 80px;}\n    h1{font-size:34px;}\n    h2{font-size:24px;}\n    .ba-grid{grid-template-columns:1fr;}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"page\">\n\n  <!-- ───────────────────────────── HERO ───────────────────────────── -->\n  <div class=\"hero\">\n    <div class=\"kicker\">UX-granskning · Maj 2026<\u002Fdiv>\n    <h1>Schemaläggning för Barnkliniken — <em>en granskning ur offentligt UX-perspektiv<\u002Fem><\u002Fh1>\n    <p class=\"lede\">\n      Verktyget är imponerande genomarbetat på domänregler och funktionsbredd. Det här dokumentet\n      fokuserar på <strong>hur det upplevs<\u002Fstrong>: kognitiv belastning, lärbarhet,\n      tillgänglighet (DOS-lagen / WCAG 2.1 AA), pedagogik och felförebyggande\n      — alltså det som avgör om en hårt belastad schemaläggare faktiskt vill öppna appen igen i morgon.\n    <\u002Fp>\n    <div class=\"meta\">\n      <div class=\"meta-item\">\n        <span class=\"meta-label\">Granskare<\u002Fspan>\n        <span class=\"meta-val\">Senior UX, offentlig sektor<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"meta-item\">\n        <span class=\"meta-label\">Granskat<\u002Fspan>\n        <span class=\"meta-val\">index.html, style.css, render.js, README<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"meta-item\">\n        <span class=\"meta-label\">Ramverk<\u002Fspan>\n        <span class=\"meta-val\">WCAG 2.1 AA · Nielsen heuristik · klarspråk<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"meta-item\">\n        <span class=\"meta-label\">Målgrupper<\u002Fspan>\n        <span class=\"meta-val\">Schemaläggare (admin) + läkare (Läkarvy)<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n\n  <!-- ───────────────────────────── SAMMANFATTNING ───────────────────────────── -->\n  <section>\n    <div class=\"sec-num\">01 / Sammanfattning<\u002Fdiv>\n    <h2>Fem saker som flyttar mest<\u002Fh2>\n    <p class=\"sec-sub\">Om du bara hinner åtgärda en handfull saker — ta dessa. De är beställda efter\n      hur stor effekt de har på upplevd användbarhet, inte hur svåra de är att bygga.<\u002Fp>\n\n    <div class=\"summary\">\n      <ol>\n        <li>\n          <strong>Bryt upp den enorma verktygsraden i tematiska grupper med en \"Mer\"-meny.<\u002Fstrong>\n          <span>22+ likvärdiga knappar i en rad bryter mot regeln \"progressive disclosure\" och tvingar användaren att läsa allt varje gång. Gruppera i 4–5 kategorier (\"Schema\", \"Personal\", \"Frånvaro\", \"Verktyg\") och göm sällananvända funktioner under en \"Mer\"-meny.<\u002Fspan>\n        <\u002Fli>\n        <li>\n          <strong>Gör emoji till illustration, inte navigation.<\u002Fstrong>\n          <span>Emoji som primär identifierare (\"🤒 Sjuk/VAB\", \"👶 Föräldraledig\") läses inkonsekvent av skärmläsare, försvinner i utskrifter, och signalerar lekfullhet i en kontext som ska kännas pålitlig. Ersätt med korta etiketter + valfritt monokromt ikonstöd.<\u002Fspan>\n        <\u002Fli>\n        <li>\n          <strong>Höj kontrasten och minsta textstorleken.<\u002Fstrong>\n          <span>Stora delar av gränssnittet använder 9–11 px text och färger som ligger på gränsen till WCAG AA (text3 mot bg, badges, statistikkort). För en myndighetsapp är detta en juridisk risk under DOS-lagen.<\u002Fspan>\n        <\u002Fli>\n        <li>\n          <strong>Förklara JV1/JV2/NLÖ/BJFS/BJLÖ/BJNV på plats — inte bara i README.<\u002Fstrong>\n          <span>Domänspråket är oundvikligt, men ny personal eller vikarier möter en mur av förkortningar. Lägg in tooltips (även på touch-enheter), en kort förklarings-popover (\"Vad är…?\") och avstavade hjälptexter i tomma tillstånd.<\u002Fspan>\n        <\u002Fli>\n        <li>\n          <strong>Lyft varningarna från en badge till en panel med åtgärdsförslag.<\u002Fstrong>\n          <span>Varningar är det mest kritiska för schemaläggaren — ändå göms de bakom en liten ⚠-badge. Visa dem som en kollapsbar panel ovanför schemat, med en konkret \"Åtgärda\"-knapp per varning som öppnar rätt cell. Använd modellen \"errors prevent, warnings inform\" konsekvent.<\u002Fspan>\n        <\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n\n    <div class=\"principles\">\n      <h4>Grundprincip för offentlig förvaltning<\u002Fh4>\n      <p>Ett bra schemaverktyg för vården är <strong>tråkigt på rätt sätt<\u002Fstrong>: förutsägbart, lugnt, otvetydigt.\n      Sparsam visuell budget, varje färg och varje knapp har en specifik betydelse, och systemet säger\n      ifrån innan användaren gör fel — inte efteråt.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ───────────────────────────── VAD SOM FUNGERAR ───────────────────────────── -->\n  <section>\n    <div class=\"sec-num\">02 / Styrkor<\u002Fdiv>\n    <h2>Det här ska du behålla<\u002Fh2>\n    <p class=\"sec-sub\">Innan vi går in på problem — det finns flera saker som är gjorda ovanligt bra\n      och som ger en stabil grund att bygga vidare på.<\u002Fp>\n\n    <ul class=\"checklist\">\n      <li><strong>Genomtänkt domänmodell.<\u002Fstrong> Regler som \"min 2 veckor mellan jourveckor\", \"max 4 journätter/månad\", \"jourledig dag efter primärjournatt\" är inbyggda i systemet, inte överlåtna till användaren. Det är skillnaden mellan ett verktyg och ett Excel-ark.<\u002Fli>\n      <li><strong>Auto-fördelningen är ett pedagogiskt grepp.<\u002Fstrong> Att låta systemet föreslå ett utgångsläge som schemaläggaren sen finjusterar är rätt mentala modell. Den respekterar både rättvisa och mänsklig översyn.<\u002Fli>\n      <li><strong>Separat Läkarvy.<\u002Fstrong> Att skilja på \"vem schemalägger\" och \"vem tittar/önskar\" är klokt — och stämmer med integritetsprincipen att läkare inte ska kunna ändra andras pass.<\u002Fli>\n      <li><strong>Bra typografival.<\u002Fstrong> DM Sans + DM Serif Display + DM Mono är ett moget, lugnt val. Mono för siffror är klockrent i ett schemaverktyg.<\u002Fli>\n      <li><strong>Den varmt cremade paletten<\u002Fstrong> (#f5f2ed + grönt) är behaglig att titta på i timmar. Inte det vanliga klinisk-vita Microsoft-utseendet.<\u002Fli>\n      <li><strong>Ändringslogg och Joursaldo.<\u002Fstrong> Spårbarhet är en kärnvärdering i offentlig sektor; ni har redan rätt idéer på plats.<\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n\n  <!-- ───────────────────────────── HUVUDPROBLEM ───────────────────────────── -->\n  <section>\n    <div class=\"sec-num\">03 / Identifierade problem<\u002Fdiv>\n    <h2>De största UX-riskerna, sorterade<\u002Fh2>\n    <p class=\"sec-sub\">Varje fynd beskriver vad jag observerat, varför det är ett problem för\n      målgruppen, och föreslår en konkret åtgärd.<\u002Fp>\n\n    <!-- FYND 1 -->\n    <article class=\"finding\">\n      <div class=\"finding-head\">\n        <span class=\"severity sev-high\">Hög<\u002Fspan>\n        <h3 class=\"finding-title\">Verktygsraden är en informations-tsunami<\u002Fh3>\n      <\u002Fdiv>\n      <div class=\"finding-body\">\n        <p>Användaren möter omedelbart 22 knappar på samma nivå, alla med emoji + text + olika\n        längd. Det skapar tre samtidiga problem:<\u002Fp>\n        <ul class=\"obs-list\">\n          <li><strong>Inget visuellt fokus.<\u002Fstrong> \"Spara\" har samma vikt som \"Joursaldo\" som har samma vikt som \"Föräldraledig\". Hjärnan kan inte gissa vad som är vanligt och vad som är ovanligt.<\u002Fli>\n          <li><strong>Hicks lag.<\u002Fstrong> Beslutstiden växer logaritmiskt med antalet val. Jämför att hitta \"Föräldraledig\" i en lista på 22 vs i en sektion \"Frånvaro\" med 5.<\u002Fli>\n          <li><strong>Den bryter ihop på mindre skärmar.<\u002Fstrong> På en 13\"-laptop wrappar raden till 3 rader och tar 100+ px av höjden — höjd som tas från själva schemat.<\u002Fli>\n        <\u002Ful>\n        <h4 style=\"margin-top:18px\">Förslag<\u002Fh4>\n        <p>Gruppera i tematiska sektioner med tydlig separator. De 4–5 vanligaste åtgärderna ligger\n        framme; resten under \"Mer\"-meny eller i kontextspecifika lägen.<\u002Fp>\n\n        <div class=\"ba-grid\">\n          <div class=\"ba-card\">\n            <div class=\"ba-label\">Idag — 22 platta knappar<\u002Fdiv>\n            <div class=\"mk-toolbar crowded\">\n              <span class=\"mk-btn\">👁 Läkarvy<\u002Fspan>\n              <span class=\"mk-btn\">👥 Läkare<\u002Fspan>\n              <span class=\"mk-btn\">⚙ Positioner<\u002Fspan>\n              <span class=\"mk-btn\">📅 Ledighet<\u002Fspan>\n              <span class=\"mk-btn\">🤒 Sjuk/VAB<\u002Fspan>\n              <span class=\"mk-btn\">👶 Föräldraledig<\u002Fspan>\n              <span class=\"mk-btn\">🔬 Ausk/Intro<\u002Fspan>\n              <span class=\"mk-btn\">📌 Övrigt<\u002Fspan>\n              <span class=\"mk-btn\">⭐ Önskemål<\u002Fspan>\n              <span class=\"mk-btn\">📚 Utbildning<\u002Fspan>\n              <span class=\"mk-btn\">📋 Deltidsschema<\u002Fspan>\n              <span class=\"mk-btn\">🎓 Handledning<\u002Fspan>\n              <span class=\"mk-btn\">🔄 Jourveckor<\u002Fspan>\n              <span class=\"mk-btn\">📊 Bemanning<\u002Fspan>\n              <span class=\"mk-btn\">⚡ Auto-fördela<\u002Fspan>\n              <span class=\"mk-btn\">👤 Personschema<\u002Fspan>\n              <span class=\"mk-btn\">⚖ Joursaldo<\u002Fspan>\n              <span class=\"mk-btn\">📋 Ändringslogg<\u002Fspan>\n              <span class=\"mk-btn\">📊 Statistik<\u002Fspan>\n              <span class=\"mk-btn\">💾 Spara<\u002Fspan>\n              <span class=\"mk-btn\">📂 Ladda<\u002Fspan>\n              <span class=\"mk-btn\">↓ Exportera<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"ba-card after\">\n            <div class=\"ba-label\">Föreslag — primära åtgärder + grupper<\u002Fdiv>\n            <div class=\"mk-toolbar-clean\">\n              <div class=\"mk-group\">\n                <span class=\"mk-btn primary\">Auto-fördela<\u002Fspan>\n                <span class=\"mk-btn\">Exportera<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"mk-divider\"><\u002Fdiv>\n              <div class=\"mk-group\">\n                <span class=\"mk-btn\">Personal ▾<\u002Fspan>\n                <span class=\"mk-btn\">Frånvaro ▾<\u002Fspan>\n                <span class=\"mk-btn\">Önskemål ▾<\u002Fspan>\n                <span class=\"mk-btn\">Rapporter ▾<\u002Fspan>\n              <\u002Fdiv>\n              <span class=\"mk-more\">⋯ Mer<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:12px;color:var(--text2);margin-top:14px;margin-bottom:0\">Sparas automatiskt — ingen \"Spara\"-knapp behövs. \"Ladda\" hör hemma under Inställningar.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <!-- FYND 2 -->\n    <article class=\"finding\">\n      <div class=\"finding-head\">\n        <span class=\"severity sev-high\">Hög<\u002Fspan>\n        <h3 class=\"finding-title\">Tillgänglighet — flera utmaningar enligt DOS-lagen<\u002Fh3>\n      <\u002Fdiv>\n      <div class=\"finding-body\">\n        <p>Som offentlig aktör omfattas barnkliniken av Lagen om tillgänglighet till digital offentlig service\n        och behöver klara WCAG 2.1 AA. Min snabba bedömning identifierar fyra konkreta områden:<\u002Fp>\n\n        <ul class=\"obs-list\">\n          <li><strong>Textstorlek.<\u002Fstrong> Många UI-element använder 9–11 px (badges, doc-meta, stat-label, ledighet-cell). WCAG kräver inte en absolut minimi-storlek, men 12 px är de facto-golvet för läsbarhet, och 14 px för brödtext.<\u002Fli>\n          <li><strong>Kontrast.<\u002Fstrong> <span class=\"pill\">--text3:#9e9893<\u002Fspan> mot <span class=\"pill\">--bg:#f5f2ed<\u002Fspan> ger ratio ≈ 3.0:1. Det <em>klarar<\u002Fem> stora rubriker men inte små texter (kräver 4.5:1). Jag har skissat ett bättre värde i mitt eget granskningsdokument: <span class=\"pill\">#6b6560<\u002Fspan> ≈ 5.2:1.<\u002Fli>\n          <li><strong>Emoji som enda identifierare.<\u002Fstrong> Skärmläsare läser ✕ som \"multiplication sign\" och 👁 som \"eye\"; bättre att kombinera ikon + text och alltid ha <span class=\"pill\">aria-label<\u002Fspan>.<\u002Fli>\n          <li><strong>Tangentbordsnavigation.<\u002Fstrong> Många modaler och kontextmenyer öppnas av musklick men har inte tydligt fokus, ESC-stängning eller fokusfälla. En schemaläggare som vill jobba snabbt vill kunna göra allt med tangentbordet.<\u002Fli>\n        <\u002Ful>\n\n        <h4 style=\"margin-top:18px\">Förslag<\u002Fh4>\n        <ul class=\"checklist\">\n          <li>Sätt basfontstorlek till 14 px och justera Tailwind/CSS-skalan därifrån. Brödtext 14, småtext 12, mikro 11 (sparsamt).<\u002Fli>\n          <li>Mörka <span class=\"pill\">--text2<\u002Fspan> till ~<span class=\"pill\">#4a4540<\u002Fspan> och <span class=\"pill\">--text3<\u002Fspan> till ~<span class=\"pill\">#6b6560<\u002Fspan>.<\u002Fli>\n          <li>Ge varje ikon-knapp en synlig textetikett. Behåll emojin om du vill, men gör texten det primära.<\u002Fli>\n          <li>Definiera en synlig fokus-ring (<span class=\"pill\">2 px solid var(--accent)<\u002Fspan> + offset) och stöd Esc för stängning, ↑↓ för listval, Enter för bekräfta.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <!-- FYND 3 -->\n    <article class=\"finding\">\n      <div class=\"finding-head\">\n        <span class=\"severity sev-high\">Hög<\u002Fspan>\n        <h3 class=\"finding-title\">Varningar är begravda — fast de är det viktigaste på sidan<\u002Fh3>\n      <\u002Fdiv>\n      <div class=\"finding-body\">\n        <p>När jag läser <span class=\"pill\">renderWarnings()<\u002Fspan> ser jag att systemet är <em>mycket<\u002Fem>\n        duktigt på att detektera regelbrott: tillsatt på ledighetsdag, schemalagd på jourledig dag,\n        över 4 journätter, obesatta obligatoriska positioner, BJNV-konflikt — listan är imponerande.<\u002Fp>\n        <p>Men användaren ser bara en liten orange <span class=\"mk-warn-bad\">⚠ 7 varningar<\u002Fspan>\n        som hen måste komma ihåg att klicka på. När varningar är det vanligaste skälet att\n        rätta något i schemat ska de vara <em>nästan första saken man läser<\u002Fem>.<\u002Fp>\n\n        <h4 style=\"margin-top:18px\">Förslag<\u002Fh4>\n        <p>Lyft varningarna till en kollapsad-men-synlig panel ovanför schemat. Varje rad har:\n        en <em>tagg<\u002Fem> som visar typ, en <em>tydlig beskrivning<\u002Fem> i klarspråk, och en\n        <em>genvägs-knapp<\u002Fem> som scrollar/öppnar rätt cell.<\u002Fp>\n\n        <div class=\"ba-grid\">\n          <div class=\"ba-card\">\n            <div class=\"ba-label\">Idag<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px;padding:20px 0\">\n              <span style=\"font-size:13px;color:var(--text2)\">Vecka 21<\u002Fspan>\n              <span class=\"mk-warn-bad\">⚠ 7 varningar<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:12px;color:var(--text2);margin:0\">Användaren måste klicka, läsa, komma ihåg, scrolla — utan länk tillbaka.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"ba-card after\">\n            <div class=\"ba-label\">Föreslag<\u002Fdiv>\n            <div class=\"mk-warn-panel\">\n              <header>\n                <strong>3 varningar denna vecka<\u002Fstrong>\n                <span>Dölj ▴<\u002Fspan>\n              <\u002Fheader>\n              <div class=\"mk-warn-row\">\n                <span class=\"tag\" style=\"background:var(--red-light);color:var(--red);border-color:var(--red)\">Konflikt<\u002Fspan>\n                <div class=\"desc\">A. Andersson har 5 journätter denna månad\n                  <em>Max enligt avtal är 4. Flytta en natt till en annan läkare.<\u002Fem><\u002Fdiv>\n                <span class=\"fix\">Åtgärda →<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"mk-warn-row\">\n                <span class=\"tag\" style=\"background:var(--warn-light);color:var(--warn);border-color:var(--warn)\">Bemanning<\u002Fspan>\n                <div class=\"desc\">Onsdag 27 maj — Mottagning saknar 1 av 3 platser\n                  <em>3 läkare är på utbildning samma dag.<\u002Fem><\u002Fdiv>\n                <span class=\"fix\">Åtgärda →<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"mk-warn-row\">\n                <span class=\"tag\">Info<\u002Fspan>\n                <div class=\"desc\">M. Mårtensson är schemalagd på dag med <em>önskad<\u002Fem> ledighet\n                  <em>Önskemålet är inte bekräftat — du kan behålla passet.<\u002Fem><\u002Fdiv>\n                <span class=\"fix\">Granska →<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <!-- FYND 4 -->\n    <article class=\"finding\">\n      <div class=\"finding-head\">\n        <span class=\"severity sev-med\">Medel<\u002Fspan>\n        <h3 class=\"finding-title\">Domänspråket är muntligt — men förklaras inte i appen<\u002Fh3>\n      <\u002Fdiv>\n      <div class=\"finding-body\">\n        <p>För etablerad personal är JV1, JV2, NLÖ, BJFS, BJLÖ, BJNV, ST, OL, FL, VAB självklara.\n        För en nyanställd, en konsult som täcker upp eller en chef som vill ha en överblick — eller\n        för en framtida tillgänglighetsgranskning från MFD — är det en mur av förkortningar.<\u002Fp>\n\n        <h4 style=\"margin-top:18px\">Förslag (tre lager pedagogik)<\u002Fh4>\n        <ul class=\"obs-list\">\n          <li><strong>Lager 1 — tooltip vid hover och fokus.<\u002Fstrong> Varje förkortning får en <span class=\"pill\">title<\u002Fspan> + en <span class=\"pill\">aria-describedby<\u002Fspan> till en gömd förklaring.<\u002Fli>\n          <li><strong>Lager 2 — popover \"?\".<\u002Fstrong> Vid sidan av rubriken \"Jourveckor\" en liten \"?\"-knapp som visar en kort förklaringspanel: vad det är, vilka pass som ingår, regler.<\u002Fli>\n          <li><strong>Lager 3 — tomma tillstånd.<\u002Fstrong> Första gången användaren öppnar t.ex. Bakjour-tabellen, visa en kort text: \"Bakjour bemannar X. Du fördelar genom att…\". Försvinner när tabellen har innehåll.<\u002Fli>\n        <\u002Ful>\n\n        <blockquote>Klarspråksprincipen: skriv för någon som <em>inte<\u002Fem> redan vet vad det heter. Ditt 50:e år som schemaläggare börjar med din 50:e nyanställning.<\u002Fblockquote>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <!-- FYND 5 -->\n    <article class=\"finding\">\n      <div class=\"finding-head\">\n        <span class=\"severity sev-med\">Medel<\u002Fspan>\n        <h3 class=\"finding-title\">Färgsystemet bär för mycket vikt<\u002Fh3>\n      <\u002Fdiv>\n      <div class=\"finding-body\">\n        <p>Jag räknar till ~22 semantiska färgvariabler (JV1, JV2, NLÖ, BJFS, BJLÖ, BJNV, BJHD, HD, BVC,\n        ledighet, sjuk, VAB, UTB, FL, deltid, night, day-s, jourledigt…). Det skapar två problem:<\u002Fp>\n        <ul class=\"obs-list\">\n          <li><strong>Igenkänningståget tar slut.<\u002Fstrong> Hjärnan klarar 5–7 färgkoder per kontext. Efter det blir det \"någon lila — vänta, vilken lila är det?\".<\u002Fli>\n          <li><strong>Färgblinda användare.<\u002Fstrong> Cirka 8 % av män har någon form av färgseende-avvikelse. Med 22 färger är det matematiskt omöjligt att hålla alla skillnader åtskilda för dem.<\u002Fli>\n        <\u002Ful>\n\n        <h4 style=\"margin-top:18px\">Förslag<\u002Fh4>\n        <p>Behåll färg som <em>förstärkare<\u002Fem> men låt <strong>form + bokstav + position<\u002Fstrong> bära huvudbudskapet.<\u002Fp>\n\n        <div class=\"mk-cells\">\n          <div class=\"mk-day\">\n            <div class=\"mk-day-h\"><strong>Mån 25 maj<\u002Fstrong><span>v.21<\u002Fspan><\u002Fdiv>\n            <div class=\"mk-slot\"><span style=\"font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);width:32px\">PJ<\u002Fspan><span>Anna A.<\u002Fspan><\u002Fdiv>\n            <div class=\"mk-slot\"><span style=\"font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);width:32px\">BJ<\u002Fspan><span>Per P.<\u002Fspan><\u002Fdiv>\n            <div class=\"mk-slot warn\"><span style=\"font-family:'DM Mono',monospace;font-size:10px;width:32px\">DJ<\u002Fspan><span>Maria M. ⚠<\u002Fspan><\u002Fdiv>\n            <div class=\"mk-slot empty\">+ Tilldela mott.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"mk-day\" style=\"padding:7px 12px\">\n            <h4 style=\"font-size:12px;margin:0 0 6px;color:var(--text2)\">Designprinciper<\u002Fh4>\n            <ul style=\"list-style:none;font-size:11px;color:var(--text2);line-height:1.6\">\n              <li>• Typ-prefix (PJ/BJ/DJ) först — läsbart utan färg<\u002Fli>\n              <li>• Färg = sekundär signal<\u002Fli>\n              <li>• Tomma tillstånd är streckade, inte färgade<\u002Fli>\n              <li>• Varningar kombinerar färg + symbol (⚠)<\u002Fli>\n              <li>• Max 6 grundfärger i tabellen<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <!-- FYND 6 -->\n    <article class=\"finding\">\n      <div class=\"finding-head\">\n        <span class=\"severity sev-med\">Medel<\u002Fspan>\n        <h3 class=\"finding-title\">Kontextmenyer säger inte <em>varför<\u002Fem><\u002Fh3>\n      <\u002Fdiv>\n      <div class=\"finding-body\">\n        <p>När man högerklickar för att tilldela en läkare visas en lista med <em>alla<\u002Fem> läkare,\n        där olämpliga är nedtonade (klassen <span class=\"pill\">.incompatible<\u002Fspan>). Det är bra att\n        de inte är gömda — då ser man helheten. Men det saknas <em>varför<\u002Fem>.<\u002Fp>\n\n        <p>Varför är Anna nedtonad? Är hon på utbildning? Saknar kompetens? Redan jour? Schemaläggaren\n        måste idag gå till andra vyer för att förstå.<\u002Fp>\n\n        <div class=\"ba-grid\">\n          <div class=\"ba-card\">\n            <div class=\"ba-label\">Idag<\u002Fdiv>\n            <div class=\"mk-ctx\">\n              <div class=\"mk-ctx-head\">Mottagning · Tis 26 maj<\u002Fdiv>\n              <div class=\"mk-ctx-row\"><span class=\"av\">AA<\u002Fspan><span class=\"name\">Anna Andersson<\u002Fspan><span class=\"badge\">3p<\u002Fspan><\u002Fdiv>\n              <div class=\"mk-ctx-row disabled\"><span class=\"av\">PB<\u002Fspan><span class=\"name\">Per Bengtsson<\u002Fspan><span class=\"badge\">5p<\u002Fspan><\u002Fdiv>\n              <div class=\"mk-ctx-row disabled\"><span class=\"av\">MM<\u002Fspan><span class=\"name\">Maria Martinsson<\u002Fspan><\u002Fdiv>\n              <div class=\"mk-ctx-row\"><span class=\"av\">SS<\u002Fspan><span class=\"name\">Stefan Strand<\u002Fspan><span class=\"badge\">2p<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"ba-card after\">\n            <div class=\"ba-label\">Föreslag — med skäl<\u002Fdiv>\n            <div class=\"mk-ctx\">\n              <div class=\"mk-ctx-head\">Mottagning · Tis 26 maj<\u002Fdiv>\n              <div class=\"mk-ctx-row recommended\"><span class=\"av\">AA<\u002Fspan><span class=\"name\">Anna Andersson<\u002Fspan><span class=\"badge\">3p · ↑rättvist<\u002Fspan><\u002Fdiv>\n              <div class=\"mk-ctx-reason\">Föredragen position · 3 pass denna vecka (lägst i gruppen)<\u002Fdiv>\n              <div class=\"mk-ctx-row disabled\"><span class=\"av\">PB<\u002Fspan><span class=\"name\">Per Bengtsson<\u002Fspan><\u002Fdiv>\n              <div class=\"mk-ctx-reason\">Jourvecka (JV1) — inte tillgänglig för dagpass<\u002Fdiv>\n              <div class=\"mk-ctx-row disabled\"><span class=\"av\">MM<\u002Fspan><span class=\"name\">Maria M.<\u002Fspan><\u002Fdiv>\n              <div class=\"mk-ctx-reason\">På utbildning hela vecka 21<\u002Fdiv>\n              <div class=\"mk-ctx-row\"><span class=\"av\">SS<\u002Fspan><span class=\"name\">Stefan Strand<\u002Fspan><span class=\"badge\">2p<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <p style=\"margin-top:14px\">Detta är en av de tyngsta UX-vinsterna i hela verktyget: <strong>förklara\n        din egen logik<\u002Fstrong>. Det skapar förtroende, lär upp nya användare, och minskar\n        \"varför kan jag inte göra X?\"-supportfrågor.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <!-- FYND 7 -->\n    <article class=\"finding\">\n      <div class=\"finding-head\">\n        <span class=\"severity sev-med\">Medel<\u002Fspan>\n        <h3 class=\"finding-title\">Spara/Ladda via JSON-fil är en risk för verksamheten<\u002Fh3>\n      <\u002Fdiv>\n      <div class=\"finding-body\">\n        <p>Att schemat sparas till en JSON-fil som användaren manuellt måste hantera skapar tre risker:<\u002Fp>\n        <ul class=\"obs-list\">\n          <li><strong>Förlust.<\u002Fstrong> Stänger användaren fliken innan hen sparat är veckors arbete borta.<\u002Fli>\n          <li><strong>Versionskollisioner.<\u002Fstrong> Två schemaläggare med olika filer — vems vinner?<\u002Fli>\n          <li><strong>Spårbarhet.<\u002Fstrong> Offentlig sektor har krav på arkivering (Riksarkivet/TF). En lokal JSON-fil på någons dator är inte en godkänd lagringsplats för verksamhetsdata.<\u002Fli>\n        <\u002Ful>\n\n        <h4 style=\"margin-top:18px\">Förslag (i prioritetsordning)<\u002Fh4>\n        <ul class=\"checklist\">\n          <li>Autospara till localStorage vid varje ändring + visa \"Sparat kl. 14:32\" diskret i headern.<\u002Fli>\n          <li>Lägg till en explicit \"Versioner\"-vy med tidstämplad historik (du har redan en Ändringslogg — bygg vidare på den).<\u002Fli>\n          <li>På längre sikt: server-backed lagring med inloggning. Behövs ändå om Läkarvyn ska visa rätt data för rätt läkare.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <!-- FYND 8 -->\n    <article class=\"finding\">\n      <div class=\"finding-head\">\n        <span class=\"severity sev-low\">Låg<\u002Fspan>\n        <h3 class=\"finding-title\">Cykla-genom-tillstånd är magiskt — och svårt att lära sig<\u002Fh3>\n      <\u002Fdiv>\n      <div class=\"finding-body\">\n        <p>I Ledighet-modalen står det: \"Klicka på veckotalet för att cykla: ingen → ledig → jourfri hel vecka → jourfri helg → ingen\". Det är en elegant interaktion för power-users, men:<\u002Fp>\n        <ul class=\"obs-list\">\n          <li>Det finns ingen ångra-väg om man råkar klicka en gång för mycket.<\u002Fli>\n          <li>Det är inte uppenbart för en förstagångsanvändare att man kan klicka.<\u002Fli>\n          <li>För skärmläsaranvändare är det helt osynligt.<\u002Fli>\n        <\u002Ful>\n        <h4 style=\"margin-top:18px\">Förslag<\u002Fh4>\n        <p>Behåll cykling som genväg, men erbjud även en <em>explicit popover<\u002Fem> vid klick med alla\n        4 alternativ som radioknappar. Power-users kan fortfarande dubbel/trippelklicka för att stega; nybörjare väljer.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <!-- FYND 9 -->\n    <article class=\"finding\">\n      <div class=\"finding-head\">\n        <span class=\"severity sev-low\">Låg<\u002Fspan>\n        <h3 class=\"finding-title\">Modaler ovanpå modaler — kontextförlust<\u002Fh3>\n      <\u002Fdiv>\n      <div class=\"finding-body\">\n        <p>Många funktioner (Önskemål, Ledighet, Rotation) öppnas i modaler som täcker hela bakgrunden.\n        Det betyder att schemaläggaren tappar synlig kontext av schemat hen försöker rätta till.<\u002Fp>\n        <h4 style=\"margin-top:18px\">Förslag<\u002Fh4>\n        <p>Konvertera komplexa modaler till sidopaneler (drawers) som tar ~40 % av bredden men låter\n        huvudschemat synas bredvid. Det matchar mönstret som Outlook och Google Calendar etablerat\n        för \"redigera mötesdetaljer\".<\u002Fp>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <!-- FYND 10 -->\n    <article class=\"finding\">\n      <div class=\"finding-head\">\n        <span class=\"severity sev-low\">Låg<\u002Fspan>\n        <h3 class=\"finding-title\">Läkarvyn behöver mer pedagogik i tomma tillstånd<\u002Fh3>\n      <\u002Fdiv>\n      <div class=\"finding-body\">\n        <p>När en läkare öppnar sin vy och inte har några pass än ser hen — vad? En tom rad?\n        Här finns en fin möjlighet att förklara: \"Här kommer ditt schema att visas när\n        det publicerats. Du kan i mellantiden lämna önskemål via knappen ovan.\"<\u002Fp>\n        <p>Tomma tillstånd är en av de mest underutnyttjade pedagogiska ytorna i offentliga\n        system. Använd dem.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n  <\u002Fsection>\n\n\n  <!-- ───────────────────────────── PRINCIPER ───────────────────────────── -->\n  <section>\n    <div class=\"sec-num\">04 / Designprinciper att luta sig mot<\u002Fdiv>\n    <h2>Fem ledord<\u002Fh2>\n    <p class=\"sec-sub\">När du står inför en designfråga och inte vet vilket håll du ska gå — pröva\n      mot dessa.<\u002Fp>\n\n    <div class=\"summary\">\n      <ol>\n        <li>\n          <strong>Klarspråk före kompakthet.<\u002Fstrong>\n          <span>\"Föräldraledig\" är bättre än \"FL\", även om FL får plats på en knapp. Hitta utrymmet någon annanstans.<\u002Fspan>\n        <\u002Fli>\n        <li>\n          <strong>Förklara systemets logik.<\u002Fstrong>\n          <span>När appen säger nej till något — säg varför. När den föreslår något — säg på vilka grunder.<\u002Fspan>\n        <\u002Fli>\n        <li>\n          <strong>Färg förstärker, form och text bär.<\u002Fstrong>\n          <span>Designen ska fungera även i gråskala. Färg är en extra signal, inte den enda.<\u002Fspan>\n        <\u002Fli>\n        <li>\n          <strong>Lugna ner det som är ovanligt, lyft det som är ofta.<\u002Fstrong>\n          <span>\"Spara\"-knappen behöver inte synas — bara fungera. Däremot ska \"se varningar\" och \"auto-fördela\" alltid vara nära.<\u002Fspan>\n        <\u002Fli>\n        <li>\n          <strong>Ångra över bekräfta.<\u002Fstrong>\n          <span>Användare gör hellre en handling och får ångra den, än läser en bekräftelsedialog som de ändå tickar bort. Bygg ångra på allt — du har redan börjat, fortsätt.<\u002Fspan>\n        <\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ───────────────────────────── PRIORITERAD LISTA ───────────────────────────── -->\n  <section>\n    <div class=\"sec-num\">05 / Prioriterad åtgärdslista<\u002Fdiv>\n    <h2>Vad gör du på måndag?<\u002Fh2>\n    <p class=\"sec-sub\">Sortering: snabba vinster överst, större projekt nederst. \"Effekt\" är min\n      bedömning av påverkan på upplevd användbarhet.<\u002Fp>\n\n    <table class=\"priority-table\">\n      <thead>\n        <tr>\n          <th>Åtgärd<\u002Fth>\n          <th>Effort<\u002Fth>\n          <th>Effekt<\u002Fth>\n        <\u002Ftr>\n      <\u002Fthead>\n      <tbody>\n        <tr>\n          <td><strong>Höj <span class=\"pill\">--text3<\u002Fspan> och minsta textstorlek till 12 px<\u002Fstrong><br><span style=\"font-size:12px;color:var(--text2)\">Tar 30 min, höjer kontrast och WCAG-status på en gång.<\u002Fspan><\u002Ftd>\n          <td class=\"effort\">~1 h<\u002Ftd>\n          <td><span class=\"impact h\">Hög<\u002Fspan><\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <td><strong>Lägg in tooltips på alla förkortningar (JV1, BJFS, ST, OL…)<\u002Fstrong><br><span style=\"font-size:12px;color:var(--text2)\">Stort pedagogiskt lyft för ny personal.<\u002Fspan><\u002Ftd>\n          <td class=\"effort\">~2 h<\u002Ftd>\n          <td><span class=\"impact h\">Hög<\u002Fspan><\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <td><strong>Autospara + \"Senast sparat kl…\" i headern<\u002Fstrong><br><span style=\"font-size:12px;color:var(--text2)\">Tar bort risken att tappa arbete.<\u002Fspan><\u002Ftd>\n          <td class=\"effort\">~3 h<\u002Ftd>\n          <td><span class=\"impact h\">Hög<\u002Fspan><\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <td><strong>Synlig fokus-ring + ESC-stöd för alla modaler<\u002Fstrong><br><span style=\"font-size:12px;color:var(--text2)\">WCAG och tangentbordsanvändare.<\u002Fspan><\u002Ftd>\n          <td class=\"effort\">~4 h<\u002Ftd>\n          <td><span class=\"impact m\">Medel<\u002Fspan><\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <td><strong>Gruppera verktygsraden i 4–5 menyer + Mer-meny<\u002Fstrong><br><span style=\"font-size:12px;color:var(--text2)\">Direkt avlastning av kognitiv börda.<\u002Fspan><\u002Ftd>\n          <td class=\"effort\">~1 dag<\u002Ftd>\n          <td><span class=\"impact h\">Hög<\u002Fspan><\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <td><strong>Lyft varningarna till en kollapsbar panel med åtgärdsknappar<\u002Fstrong><br><span style=\"font-size:12px;color:var(--text2)\">Detta är schemaläggarens viktigaste arbetsyta.<\u002Fspan><\u002Ftd>\n          <td class=\"effort\">~2 dagar<\u002Ftd>\n          <td><span class=\"impact h\">Hög<\u002Fspan><\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <td><strong>Lägg in \"skäl\" i kontextmenyn (varför är denna läkare nedtonad?)<\u002Fstrong><br><span style=\"font-size:12px;color:var(--text2)\">Förvandlar verktyget till en lärande assistent.<\u002Fspan><\u002Ftd>\n          <td class=\"effort\">~2 dagar<\u002Ftd>\n          <td><span class=\"impact h\">Hög<\u002Fspan><\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <td><strong>Konvertera de tyngsta modalerna (Önskemål, Rotation, Ledighet) till drawers<\u002Fstrong><br><span style=\"font-size:12px;color:var(--text2)\">Behåll kontext av schemat samtidigt som man redigerar.<\u002Fspan><\u002Ftd>\n          <td class=\"effort\">~3–5 dagar<\u002Ftd>\n          <td><span class=\"impact m\">Medel<\u002Fspan><\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <td><strong>Bygg serverbaserad lagring + inloggning<\u002Fstrong><br><span style=\"font-size:12px;color:var(--text2)\">Krävs för riktig flerfärganvändning och arkivering.<\u002Fspan><\u002Ftd>\n          <td class=\"effort\">~2 v<\u002Ftd>\n          <td><span class=\"impact m\">Medel<\u002Fspan><\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <td><strong>Tillgänglighetsgranskning av extern part + åtgärda<\u002Fstrong><br><span style=\"font-size:12px;color:var(--text2)\">Innan produktion. Lagkrav.<\u002Fspan><\u002Ftd>\n          <td class=\"effort\">~1 v<\u002Ftd>\n          <td><span class=\"impact h\">Hög<\u002Fspan><\u002Ftd>\n        <\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n  <\u002Fsection>\n\n\n  <!-- ───────────────────────────── AVSLUTNING ───────────────────────────── -->\n  <section>\n    <div class=\"sec-num\">06 / Avslutning<\u002Fdiv>\n    <h2>Sammanfattning i en mening<\u002Fh2>\n    <p style=\"font-size:20px;line-height:1.5;color:var(--text);max-width:680px;font-family:'DM Serif Display',serif;\">\n      Den hårda delen — domänlogiken — är redan klar. Det som återstår är att <em>lugna ner ytan<\u002Fem>,\n      <em>förklara det systemet redan vet<\u002Fem>, och göra de tio mest använda interaktionerna\n      lite mer förlåtande.\n    <\u002Fp>\n\n    <p style=\"margin-top:24px;color:var(--text2)\">Vill du att jag bygger mockups av någon specifik vy — t.ex. den föreslagna varnings-panelen,\n    omgrupperade verktygsraden eller en drawer-version av Önskemåls-modalen — så gör jag det\n    som nästa steg. Säg bara vilken som är mest värdefull att se på.<\u002Fp>\n  <\u002Fsection>\n\n\n  <footer>\n    <span>UX-granskning · Schemaläggning Barnkliniken · v1<\u002Fspan>\n    <span>2026-05-20<\u002Fspan>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
